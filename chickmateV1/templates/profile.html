<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Profile | Chick Mate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body.dark-mode {
      background-color: #2c2c2c !important;
      color: #f8f9fa;
    }
    .toggle-theme-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .profile-image {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #007bff;
    }
    .card-custom {
      max-width: 420px;
      margin: auto;
      border-radius: 12px;
    }
    .form-control,
    .btn {
      border-radius: 8px;
    }
    .form-label {
      font-weight: 500;
    }
  </style>
</head>
<body class="bg-light position-relative">

<!-- 🌗 Theme Toggle Button -->
<button class="toggle-theme-btn" onclick="toggleTheme()" title="Toggle dark/light mode">
  <span id="theme-icon">🌙</span>
</button>

<div class="container py-5 d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow card-custom p-4 w-100">
    <h2 class="text-center mb-4">User Profile</h2>

    <!-- Profile Picture and Role Badge -->
    <div class="text-center mb-4">
      <img src="https://via.placeholder.com/100" alt="Profile Picture" class="profile-image">
      <p class="mt-2">
        <span class="badge bg-secondary">User</span>
      </p>
    </div>

    <form>
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" value="John Doe" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" value="johndoe@example.com" class="form-control" required>
        <small class="text-danger">Email not verified</small>
        <a href="#" class="btn btn-link btn-sm">Resend verification</a>
      </div>
      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="tel" name="phone" value="+91-9876543210" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Change Profile Image</label>
        <input type="file" name="profile_image" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">New Password <small class="text-muted">(optional)</small></label>
        <input type="password" name="new_password" class="form-control">
      </div>
      <button type="submit" class="btn btn-success w-100">Update Profile</button>
    </form>

    <div class="d-flex justify-content-between mt-4">
      <a href="#" class="btn btn-outline-secondary">← Dashboard</a>
      <a href="#" class="btn btn-outline-danger">Deactivate</a>
    </div>
  </div>
</div>
</body>
</html>
